{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select User</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0f10,#1b1b1d,#2a2a2d);padding:30px;}
.corner-logo{position:fixed;top:30px;left:40px;width:110px;background:white;padding:8px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:999;}
.page-container{display:flex;flex-direction:column;width:950px;max-width:100%;height:90vh;border-radius:18px;overflow:hidden;background:#f5f5f5;box-shadow:0 18px 50px rgba(0,0,0,0.35);}
.header{background:#111;color:#fff;padding:30px 40px;}
.header h1{font-size:32px;margin-bottom:8px;}
.header p{font-size:15px;color:#cfcfcf;}
.content{padding:28px 40px;display:flex;flex-direction:column;flex:1;}
.select-box{width:100%;max-width:420px;margin-top:16px;padding:12px 14px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:16px;color:#111;}
.open-chat-btn{display:inline-block;margin-top:16px;padding:12px 16px;border:none;border-radius:8px;background:#111;color:white;font-weight:600;text-decoration:none;cursor:pointer;}
.top-right-btn{position:absolute;top:38px;right:40px;padding:12px 12px;border-radius:8px;background:#fff;font-size:17px;color:#111;border:1px solid #ccc;text-decoration:none;}
.back-btn{display:inline-block;margin-top:14px;color:#111;text-decoration:none;}
</style>
</head>
<body>
<a href="{% url 'index' %}"><img src="{% static 'images/shho-logo.png' %}" class="corner-logo"></a>
<div class="page-container">
    <div class="header" style="position:relative;display:flex;align-items:center;justify-content:space-between;">
        <div>
            <h1>Select User</h1>
            <p>Select a user to start messaging.</p>
        </div>
        <a href="{% url 'inbox' %}" class="top-right-btn">Back to Inbox</a>
    </div>
    <div class="content">
        {% if users %}
            <select id="userSelect" class="select-box" onchange="if(this.value){window.location.href=this.value;}">
                <option value="">-- Select a user --</option>
                {% for user in users %}
                    <option value="{% url 'send_message' user.username %}">{{ user.username }}</option>
                {% endfor %}
            </select>
        {% else %}
            <p>No users available.</p>
        {% endif %}
    </div>
</div>
</body>
</html>
