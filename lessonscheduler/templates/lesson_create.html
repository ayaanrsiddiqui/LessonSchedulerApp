<!-- generated by Chat GPT, requested to match the design of other pages-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Lesson</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f0f10, #1b1b1d, #2a2a2d);
        color: #e5e7eb;
        padding: 24px 14px;
    }
    .container {
        max-width: 800px;
        margin: 0 auto;
    }
    .card {
        background: linear-gradient(160deg, #111111, #1d1d1f 55%, #2c2c2f);
        border-radius: 12px;
        padding: 22px;
        box-shadow: 0 12px 28px rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.08);
    }
    h1 {
        margin-top: 0;
        color: #ffffff;
    }
    form input, form textarea, form select {
        width: 100%;
        padding: 10px;
        margin-bottom: 12px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #1a1a1d;
        color: #e5e7eb;
    }
    form button {
        padding: 10px 15px;
        border-radius: 6px;
        background: #0066cc;
        color: #ffffff;
        border: none;
        cursor: pointer;
        font-size: 14px;
    }
    .btn, .btn-secondary {
    display: inline-block;
    padding: 9px 13px;
    border-radius: 6px;
    text-decoration: none;   /* 🔹 remove underline */
    text-align: center;
    font-size: 14px;
    color: #ffffff;          /* text color */
    cursor: pointer;
    }

    form button:hover {
        background: #0052a3;
    }
    .btn-secondary {
        background: #666;
    }
    .btn-secondary:hover {
        background: #555;
    }
    .btn-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
    }
</style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Post New Class</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Lesson</button>
        </form>
        <div class="btn-row">
            <a class="btn btn-secondary" href="{% url 'index' %}">Back to Upcoming Lessons</a>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const startInput = document.getElementById("id_start_time");
    const endInput = document.getElementById("id_end_time");

    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");

    const localMin =
        now.getFullYear() + "-" +
        pad(now.getMonth() + 1) + "-" +
        pad(now.getDate()) + "T" +
        pad(now.getHours()) + ":" +
        pad(now.getMinutes());

    if (startInput) startInput.min = localMin;
    if (endInput) endInput.min = localMin;

    function setCustomMessage(input) {
        input.addEventListener("invalid", function () {
            if (input.validity.valueMissing) {
                input.setCustomValidity("Please fill out this field.");
            } else if (input.validity.rangeUnderflow) {
                input.setCustomValidity("Time must be in the future.");
            } else {
                input.setCustomValidity("");
            }
        });

        input.addEventListener("input", function () {
            input.setCustomValidity("");
        });
    }

    if (startInput) setCustomMessage(startInput);
    if (endInput) setCustomMessage(endInput);
});
</script>


</body>
</html>
