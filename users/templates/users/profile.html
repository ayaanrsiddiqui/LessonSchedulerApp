

<h1>{{ request.user.first_name }} {{ request.user.last_name }}</h1>
<p>Email: {{ request.user.email }}</p>

{% if profile.profile_picture %}
<img src="{{ profile.profile_picture }}" alt="Profile Picture" width="150">
{% endif %}

<p>Bio: {{ profile.bio }}</p>
<p>Role: {% if profile.is_djteacher %}Teacher{% else %}Student{% endif %} — <a href="{% url 'edit_role' %}">Change</a></p>

<form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit">Sign Out</button>
</form>

<!-- # Copilot, 3/14/26, "add a button to go back to the home page" -->
<a href="{% url 'index' %}">Back to Home</a>
