## Generated with Copilot on March 14, 2026
## Prompt: could a user add a page where the user can change their profile type whenever they would like?
-->

<h1>Change Role</h1>
<p>Current role: {{ profile.get_role_display }}</p>

<form method="post">
    {% csrf_token %}
    <p>Select your role:</p>
    <label>
        <input type="radio" name="role" value="student" {% if profile.role == 'student' %}checked{% endif %}>
        Student
    </label><br>
    <label>
        <input type="radio" name="role" value="teacher" {% if profile.role == 'teacher' %}checked{% endif %}>
        Teacher
    </label><br><br>
    <button type="submit">Save</button>
</form>

<a href="{% url 'profile' %}">Cancel</a>
