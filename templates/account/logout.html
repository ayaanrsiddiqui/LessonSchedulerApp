{% load i18n %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% trans "Sign Out" %}</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0f10,#1b1b1d,#2a2a2d);padding:30px;}
.corner-logo{position:fixed;top:30px;left:40px;width:110px;background:white;padding:8px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:999;}
.page-container{display:flex;width:950px;max-width:100%;min-height:560px;border-radius:18px;overflow:hidden;background:#f5f5f5;box-shadow:0 18px 50px rgba(0,0,0,0.35);}
.left-panel{flex:1;background:linear-gradient(160deg,#111111,#1d1d1f 55%,#2c2c2f);color:white;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:60px 50px;}
.left-panel h1{font-size:44px;font-weight:700;letter-spacing:1px;margin-bottom:18px;}
.left-panel p{font-size:17px;line-height:1.6;color:#d7d7d7;max-width:360px;}
.login-panel{flex:1;background:white;display:flex;align-items:center;justify-content:center;padding:50px 40px;}
.login-wrapper{width:100%;max-width:360px;}
.login-wrapper h2{font-size:32px;margin-bottom:10px;color:#111;}
.subtitle{margin-bottom:28px;color:#666;font-size:15px;line-height:1.5;}
.signin-btn{width:100%;padding:14px;border:none;border-radius:8px;background:#111;color:white;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;transition:0.2s ease;}
.signin-btn:hover{background:#2a2a2a;}
@media (max-width:850px){
.page-container{flex-direction:column;}
.left-panel,.login-panel{width:100%;}
.left-panel{padding:40px 30px;}
.login-panel{padding:36px 24px;}
}
</style>
</head>
<body>

<a href="{% url 'index' %}">
<img src="{% static 'images/shho-logo.png' %}" class="corner-logo">
</a>

<div class="page-container">
  <div class="left-panel">
    <h1>TITLE</h1>
    <p>Schedule With The Best DJs at UVA!</p>
  </div>

  <div class="login-panel">
    <div class="login-wrapper">
      <h2>{% trans "Sign Out" %}</h2>
      <p class="subtitle">{% trans 'Are you sure you want to sign out?' %}</p>

      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        {% if redirect_field_value %}
          <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
        {% endif %}
        <button class="signin-btn" type="submit">{% trans 'Sign Out' %}</button>
      </form>
    </div>
  </div>
</div>

</body>
</html>
