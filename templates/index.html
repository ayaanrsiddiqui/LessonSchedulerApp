{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#0f0f10,#1b1b1d,#2a2a2d);
padding:30px;
color:white;
}

/* logo top left */

.corner-logo{
position:fixed;
top:30px;
left:40px;
width:110px;
background:white;
padding:8px;
border-radius:10px;
box-shadow:0 6px 18px rgba(0,0,0,.35);
z-index:999;
}

/* center container */

.page-container{
width:900px;
max-width:95%;
min-height:500px;
border-radius:18px;
background:linear-gradient(160deg,#111111,#1d1d1f 55%,#2c2c2f);
box-shadow:0 18px 50px rgba(0,0,0,0.4);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:60px;
}

/* title */

.title{
font-size:42px;
font-weight:700;
margin-bottom:25px;
line-height:1.3;
}

/* subtitle */

.subtitle{
font-size:18px;
color:#cfcfcf;
margin-bottom:40px;
}

/* buttons */

.button-container{
display:flex;
gap:20px;
}

.btn{
padding:14px 28px;
border-radius:8px;
font-size:16px;
font-weight:600;
text-decoration:none;
cursor:pointer;
transition:0.2s ease;
}

/* login button */

.login-btn{
background:white;
color:black;
}

.login-btn:hover{
background:#e6e6e6;
}

/* signup button */

.signup-btn{
border:1px solid #ccc;
color:white;
background:transparent;
}

.signup-btn:hover{
background:rgba(255,255,255,0.08);
}

</style>
</head>


<body>

<a href="/">
<img src="{% static 'images/shho-logo.png' %}" class="corner-logo">
</a>

<div class="page-container">

<div class="title">
This works! Team Number: A-12; Members: Lillie Paris, Jamar Oldacre, Elsa Norman, Sid Luthra, Ayaan Siddiqui
</div>

<div class="subtitle">
Schedule With The Best DJs at UVA
</div>

<div class="button-container">

<a href="/accounts/login/" class="btn login-btn">
Login
</a>

<a href="/accounts/signup/" class="btn signup-btn">
Sign Up
</a>

</div>

</div>

</body>
</html>
