{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;

    background:
        linear-gradient(
        rgba(0,0,0,0.75),
        rgba(0,0,0,0.75)
        ),
    url('{% static "images/djBackground3.PNG" %}');
        
    background-size: 100%;
    background-repeat: no-repeat;
    background-position: center 75%;
}

/* logo top left */

.corner-logo{
    position: fixed;
    top: 30px;
    left: 40px;

    width: 90px;     
    height: 90px;     

    padding: 8px;
    border-radius: 10px;

    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    z-index: 999;

    display: block;
}

/* center container */

.page-container{
width:900px;
max-width:95%;
min-height:500px;
border-radius:18px;

background: transparent;   /* FIXED */
box-shadow: none;          /* FIXED */

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:60px;
}

/* title */

.title{
font-size:80px;
color:#ffffff;
font-weight:700;
margin-bottom:15px;
line-height:1.3;
}

/* subtitle */

.subtitle{
font-size:20px;
color:#cfcfcf;
margin-top: 20px;
margin-bottom:40px;
}

/* buttons */

.button-container{
display:flex;
gap:50px;
margin-top:60px;   /* FIXED spacing */
}

.btn{
padding:20px 40px;   /* FIXED bigger */
border-radius:8px;
font-size:20px;      /* FIXED bigger */
font-weight:600;
text-decoration:none;
cursor:pointer;
transition:0.2s ease;
}

/* login button */

.login-btn{
background:white;
color:black;

}

.login-btn:hover{
background:#e6e6e6;
}

/* signup button */

.signup-btn{
color:rgb(0, 0, 0);
background:white;
}

.signup-btn:hover{
background:rgb(255, 255, 255);
}

</style>
</head>


<body>

<a href="{% url 'index' %}">
    <img src="/static/images/shhoLogo.png" class="corner-logo">
</a>

<div class="page-container">

<div class="title">
SHHO
</div>

<div class="title">
 Lesson Hub
</div>

<div class="subtitle">
Student Hip Hop Organization @ UVA
</div>

<div class="button-container">

<a href="/accounts/login/" class="btn login-btn">
Get Started
</a>

</div>

</div>

</body>
</html>
